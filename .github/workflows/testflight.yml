name: Build & Upload to TestFlight

# ── Triggers ─────────────────────────────────────────────────────────────────
# Every push to main → fast compile + test check (no signing needed)
# Every v* tag       → full archive + TestFlight upload (requires secrets)
# Manual dispatch    → full pipeline
on:
  push:
    branches: [ main ]
    tags:     [ 'v*' ]
  workflow_dispatch:
    inputs:
      full_pipeline:
        description: 'Run full signing + upload pipeline'
        required: false
        default: 'false'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: '16.2'
  PROJECT:       'Lexora.xcodeproj'
  SCHEME:        'Lexora'
  BUNDLE_ID:     'com.yiga.Lexora'

# ── Job 1: Build + Test (every push to main) ─────────────────────────────────
jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    # Always run on main pushes; also run as part of release pipeline
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode ${{ env.XCODE_VERSION }}
      run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

    - name: Cache DerivedData
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-dd-${{ hashFiles('**/*.swift', 'Lexora.xcodeproj/project.pbxproj') }}
        restore-keys: ${{ runner.os }}-dd-

    - name: Resolve Swift packages
      run: |
        xcodebuild -resolvePackageDependencies \
          -project "$PROJECT" -scheme "$SCHEME"

    - name: Build & test (no signing)
      run: |
        xcodebuild test \
          -project "$PROJECT" \
          -scheme  "$SCHEME" \
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
          -configuration Debug \
          -resultBundlePath TestResults.xcresult \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          -quiet \
          || xcodebuild build \
               -project "$PROJECT" \
               -scheme  "$SCHEME" \
               -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
               -configuration Debug \
               CODE_SIGN_IDENTITY="" \
               CODE_SIGNING_REQUIRED=NO \
               -quiet

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: TestResults-${{ github.sha }}
        path: TestResults.xcresult
        if-no-files-found: ignore
        retention-days: 7

# ── Job 2: Archive + TestFlight (tags only) ───────────────────────────────────
  release:
    name: Archive → TestFlight
    runs-on: macos-15
    needs: build-and-test
    # Only run on v* tags or explicit workflow_dispatch with full_pipeline=true
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.full_pipeline == 'true'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode ${{ env.XCODE_VERSION }}
      run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

    # ── Install signing assets ────────────────────────────────────────────────
    - name: Install certificate and provisioning profile
      env:
        BUILD_CERTIFICATE_BASE64:       ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        BUILD_CERTIFICATE_PASSWORD:     ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
        BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        KEYCHAIN_PASSWORD:              ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        CERT_PATH=$RUNNER_TEMP/dist_cert.p12
        PP_PATH=$RUNNER_TEMP/lexora_appstore.mobileprovision
        KEYCHAIN_PATH=$RUNNER_TEMP/ci.keychain-db

        echo "$BUILD_CERTIFICATE_BASE64"       | base64 --decode -o "$CERT_PATH"
        echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain   -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security import "$CERT_PATH" \
          -P "$BUILD_CERTIFICATE_PASSWORD" \
          -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        security list-keychain -d user -s "$KEYCHAIN_PATH"

        PP_UUID=$(grep -a -A 1 'UUID' "$PP_PATH" | grep -o '[-A-Z0-9]\{36\}')
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PP_UUID".mobileprovision

    - name: Cache DerivedData
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-dd-${{ hashFiles('**/*.swift', 'Lexora.xcodeproj/project.pbxproj') }}
        restore-keys: ${{ runner.os }}-dd-

    # ── Archive ───────────────────────────────────────────────────────────────
    - name: Archive
      run: |
        xcodebuild archive \
          -project "$PROJECT" \
          -scheme  "$SCHEME" \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath "$RUNNER_TEMP/Lexora.xcarchive" \
          DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY="Apple Distribution" \
          PROVISIONING_PROFILE_SPECIFIER="Lexora App Store" \
          -quiet

    # ── Export IPA ────────────────────────────────────────────────────────────
    - name: Write ExportOptions.plist
      run: |
        cat > "$RUNNER_TEMP/ExportOptions.plist" << PLIST
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0"><dict>
          <key>method</key>              <string>app-store-connect</string>
          <key>teamID</key>              <string>${{ secrets.APPLE_TEAM_ID }}</string>
          <key>signingStyle</key>        <string>manual</string>
          <key>uploadSymbols</key>       <true/>
          <key>compileBitcode</key>      <false/>
          <key>provisioningProfiles</key>
          <dict>
            <key>com.yiga.Lexora</key>         <string>Lexora App Store</string>
            <key>com.yiga.Lexora.Widget</key>   <string>Lexora Widget App Store</string>
            <key>com.yiga.Lexora.Keyboard</key> <string>Lexora Keyboard App Store</string>
          </dict>
        </dict></plist>
        PLIST

    - name: Export IPA
      run: |
        xcodebuild -exportArchive \
          -archivePath        "$RUNNER_TEMP/Lexora.xcarchive" \
          -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
          -exportPath         "$RUNNER_TEMP/export" \
          -quiet

    # ── Upload to TestFlight ──────────────────────────────────────────────────
    - name: Install App Store Connect API key
      run: |
        mkdir -p ~/.appstoreconnect/private_keys
        echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" \
          | base64 --decode \
          > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

    - name: Validate IPA
      run: |
        xcrun altool --validate-app \
          --type ios \
          --file      "$RUNNER_TEMP/export/Lexora.ipa" \
          --apiKey    "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
          --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
          --output-format json

    - name: Upload to TestFlight
      run: |
        xcrun altool --upload-app \
          --type ios \
          --file      "$RUNNER_TEMP/export/Lexora.ipa" \
          --apiKey    "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
          --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
          --output-format json

    # ── Artifacts & cleanup ───────────────────────────────────────────────────
    - name: Upload IPA artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Lexora-${{ github.ref_name }}.ipa
        path: ${{ runner.temp }}/export/Lexora.ipa
        retention-days: 14

    - name: Upload archive on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Lexora-archive-${{ github.ref_name }}
        path: ${{ runner.temp }}/Lexora.xcarchive
        if-no-files-found: ignore
        retention-days: 3

    - name: Clean up keychain
      if: always()
      run: security delete-keychain "$RUNNER_TEMP/ci.keychain-db" || true
